name: Batch — collect signal every 4h

# Runs the last30days engine in 6 source-group batches per day, each with
# its own slice of the 32 seeds in topics.yml. Every batch dumps one Report
# JSON per seed to data/<YYYY-MM-DD>/<HHMM>-<group>-<slug>.json on the
# `data` branch. The daily-brief.yml workflow merges them at 23:00 UTC.
#
# Required secrets: none for the always-free sources. Optional:
#   - SCRAPECREATORS_API_KEY  (TikTok / Instagram)
#   - OPENROUTER_API_KEY      (Perplexity Sonar web search)
#   - BRAVE_API_KEY           (Brave web search)
#   - X auth (AUTH_TOKEN/CT0 or XAI_API_KEY)
#   - BSKY_HANDLE / BSKY_APP_PASSWORD
# Missing keys mean that batch's source group runs empty — workflow still
# succeeds.

on:
  # Every 4 hours starting at 00:00 UTC. The hour-of-day picks the source
  # group; see the `select-group` step below.
  schedule:
    - cron: '0 0,4,8,12,16,20 * * *'
  # Manual trigger for testing — pick a group + topic + date overrides.
  workflow_dispatch:
    inputs:
      group:
        description: 'Source group override (A-F)'
        required: false
        default: ''
      topic:
        description: 'Single topic override (skips topics.yml rotation)'
        required: false
        default: ''
      seed_count:
        description: 'How many seeds from topics.yml per run'
        required: false
        default: '4'
  # Label-based trigger: add the `run-batch` label to any issue and this
  # workflow fires once. The label is auto-removed when the run finishes
  # so re-labelling triggers a fresh run. Useful for one-tap testing
  # without leaving the GitHub UI.
  issues:
    types: [labeled]

permissions:
  contents: write   # commits to the `data` branch
  issues: write     # to remove the trigger label + post the run-URL comment

concurrency:
  # Don't pile up batches if a previous run is still going.
  group: batch-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  batch:
    # When the trigger is `issues.labeled`, only run if the label that was
    # just applied is `run-batch`. All other label changes are ignored.
    if: github.event_name != 'issues' || github.event.label.name == 'run-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Acknowledge label trigger on the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Batch workflow triggered via \`run-batch\` label. Watch progress at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "run-batch"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Pick source group from hour-of-day
        id: select-group
        run: |
          set -euo pipefail
          OVERRIDE="${{ github.event.inputs.group }}"
          if [ -n "$OVERRIDE" ]; then
            GROUP="$OVERRIDE"
          else
            HOUR=$(date -u +%H)
            case "$HOUR" in
              00) GROUP=A ;;
              04) GROUP=B ;;
              08) GROUP=C ;;
              12) GROUP=D ;;
              16) GROUP=E ;;
              20) GROUP=F ;;
              *)  GROUP=A ;;  # workflow_dispatch at odd times
            esac
          fi
          case "$GROUP" in
            A) SOURCES=reddit,hackernews ;;
            B) SOURCES=x,bluesky ;;
            C) SOURCES=youtube ;;
            D) SOURCES=tiktok,instagram ;;
            E) SOURCES=github ;;  # polymarket dropped: betting markets are not app ideas
            F) SOURCES=grounding,perplexity ;;
            *) echo "Unknown group $GROUP"; exit 1 ;;
          esac
          echo "group=$GROUP" >> "$GITHUB_OUTPUT"
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          echo "Group $GROUP → sources: $SOURCES"

      - name: Pick seeds for this batch
        id: seeds
        run: |
          set -euo pipefail
          OVERRIDE="${{ github.event.inputs.topic }}"
          COUNT="${{ github.event.inputs.seed_count }}"
          COUNT="${COUNT:-4}"
          if [ -n "$OVERRIDE" ]; then
            printf '%s\n' "$OVERRIDE" > selected_seeds.txt
          else
            uv run --frozen python3 skills/last30days/scripts/select_seeds.py \
              --topics topics.yml --count "$COUNT" \
              > selected_seeds.txt
          fi
          echo "Selected seeds:"
          cat selected_seeds.txt
          echo "count=$(wc -l < selected_seeds.txt)" >> "$GITHUB_OUTPUT"

      - name: Run engine for each seed
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          BRAVE_API_KEY:          ${{ secrets.BRAVE_API_KEY }}
          XAI_API_KEY:            ${{ secrets.XAI_API_KEY }}
          AUTH_TOKEN:             ${{ secrets.AUTH_TOKEN }}
          CT0:                    ${{ secrets.CT0 }}
          BSKY_HANDLE:            ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD:      ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          DAY=$(date -u +%Y-%m-%d)
          HOUR=$(date -u +%H%M)
          GROUP="${{ steps.select-group.outputs.group }}"
          mkdir -p "data/${DAY}"
          # Persistent stderr log for this batch — committed alongside the
          # per-seed JSONs so failures are greppable later (Actions logs
          # expire after 90 days; the data branch keeps them indefinitely).
          LOG_FILE="data/${DAY}/${HOUR}-${GROUP}-stderr.log"
          {
            echo "Batch ${GROUP} sources=${{ steps.select-group.outputs.sources }}"
            echo "Started at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "----"
          } > "$LOG_FILE"

          SUCCESS=0
          FAILED=0
          while IFS= read -r SEED; do
            [ -z "$SEED" ] && continue
            echo "::group::Seed: $SEED"
            echo "" >> "$LOG_FILE"
            echo "===== Seed: $SEED =====" >> "$LOG_FILE"
            if uv run --frozen python3 skills/last30days/scripts/last30days.py \
                 "$SEED" \
                 --search "${{ steps.select-group.outputs.sources }}" \
                 --emit json \
                 --save-batch data \
                 2>>"$LOG_FILE"; then
              SUCCESS=$((SUCCESS + 1))
              echo "[OK] seed succeeded" >> "$LOG_FILE"
            else
              FAILED=$((FAILED + 1))
              echo "[FAIL] engine returned non-zero for seed: $SEED" | tee -a "$LOG_FILE"
            fi
            echo "::endgroup::"
          done < selected_seeds.txt

          {
            echo ""
            echo "----"
            echo "Batch summary: ${SUCCESS} succeeded, ${FAILED} failed"
          } | tee -a "$LOG_FILE"

          # All-failed = batch is dead, fail the workflow run loud and red.
          # One success out of N = green (transient per-seed failures are
          # the normal case for rate-limited sources).
          if [ "$SUCCESS" -eq 0 ] && [ "$FAILED" -gt 0 ]; then
            echo "::error::All ${FAILED} seeds failed in batch ${GROUP}. See ${LOG_FILE} on the data branch."
            exit 1
          fi

      - name: Stash results before switching branches
        id: stash
        run: |
          set -euo pipefail
          if [ -d data ] && [ -n "$(find data -name '*.json' -type f -print -quit)" ]; then
            mkdir -p /tmp/batch-out
            cp -r data/* /tmp/batch-out/
            echo "have_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "No JSON results produced this batch."
            echo "have_results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit results to `data` branch
        if: steps.stash.outputs.have_results == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data:data
            git checkout data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data
          cp -r /tmp/batch-out/* data/
          git add data
          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi
          GROUP="${{ steps.select-group.outputs.group }}"
          COUNT="${{ steps.seeds.outputs.count }}"
          git commit -m "batch ${GROUP}: ${COUNT} seed(s) at $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin data
