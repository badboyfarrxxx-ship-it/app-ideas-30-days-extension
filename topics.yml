# topics.yml — seeds for the mobile-app-idea mining pipeline.
#
# Scope (locked 2026-05-20): MOBILE ONLY (Android + iOS). Every seed below is
# tuned for one of two signals — (a) someone explicitly says they would pay
# for a mobile app, or (b) someone is frustrated with an existing mobile
# app / can't find one. The downstream synthesis prompt in
# .github/workflows/daily-brief.yml ranks willingness-to-pay evidence
# higher but keeps PAIN-only ideas (since 2026-09-24). Seeds are just
# the funnel.
#
# Each entry under pain_phrases / vertical_pains / communities / launch_signals
# / rotating becomes a query that the GitHub Actions batch workflow passes to
# `last30days.py` once per batch. The engine searches Reddit/HN/X/YouTube/
# GitHub for matches over a rolling 30-day window. The day-aggregator
# (scripts/aggregate_day.py) then filters the merged pool through the same
# pain-language regex defined here.
#
# Editing rules:
#   - One seed per line, in YAML list form.
#   - `enabled: false` (top of any list) disables the whole list cheaply.
#   - Keep pain-phrase seeds quoted ('"I wish ..."') so the search engine
#     treats them as literal phrases.
#   - Mix (2026-09-24): roughly equal broad pain phrases and niche
#     vertical pains, plus a few rotating wildcards. Broad phrases alone
#     mostly returned generic "better app than" moaning; niche audiences
#     (trades, specific students, small operators) surface sharper gaps.
#
# Why this shape: see doc.md §6 and the seed-design research summary.

defaults:
  window_days: 30
  # An idea is only "validated" when independently raised in this many
  # distinct sources/communities. The cluster + rerank passes already do
  # cross-source clustering; this threshold is a hint to the synthesis
  # prompt to downrank single-source clusters.
  min_communities: 3
  # Shared pain + willingness-to-pay vocabulary. Two clauses:
  #   (1) classic pain language ("I wish", "why is there no", …)
  #   (2) explicit WTP language ("I would pay", "currently paying $X", …)
  # The synthesis prompt ranks clause (2) matches first; clause (1) alone
  # still qualifies.
  pain_regex: '\b(i wish there was|why is there no|is there an app|is there a paid app|better app than|frustrated with|sick of|tired of|any good app for|i would pay|i.d pay|currently paying \$?\d+|happy to pay|worth paying|worth \$?\d+/mo)\b'

# --- Pain-phrase seeds (broad, quote them literally) ------------------------
# General complaint and wish language. Kept broad on purpose so the pool
# still catches ideas outside the niches below.
pain_phrases:
  - '"I wish there was an app for"'
  - '"I would pay for an app"'
  - '"I.d pay for an app"'
  - '"why is there no app"'
  - '"is there an app that"'
  - '"any good app for"'
  - '"frustrated with" app'
  - '"sick of" app subscription'
  - '"worth paying for" app'
  - '"I still use a spreadsheet for"'
  - '"I track it in my notes app"'
  - '"there has to be a better way to"'

# --- Vertical-pain seeds (niche audiences with jobs to get done) ------------
# Looser than before: the audience does the narrowing, so the phrase can be
# any sign of a manual workaround or an app gap, not only "I would pay".
vertical_pains:
  - 'nursing students app for studying'
  - 'rad tech student app'
  - 'electricians app for quotes'
  - 'plumbers "is there an app"'
  - 'landscapers app for scheduling clients'
  - 'dog groomers booking app'
  - 'personal trainers app for clients'
  - 'hairstylists "any good app for"'
  - 'realtors "any good app for"'
  - 'truckers "is there an app that"'
  - 'nurses shift app'
  - 'therapists "I would pay for an app"'
  - 'teachers "I wish there was an app"'
  - 'small landlords app for tenants'
  - 'freelancers "I wish there was an app"'
  - 'parents "I would pay for an app"'
  - 'caregivers app for elderly parent'
  - 'small business owners "is there an app"'
  - 'farmers "is there an app"'
  - 'anglers "I wish there was an app"'

# --- Rotating wildcards (intended to be overwritten weekly via PR) ----------
rotating:
  - 'AI mobile app gaps "would pay"'
  - 'side hustle "is there an app"'
  - 'hobby app "I wish there was"'

# --- Community firehoses (mobile-focused subs) ------------------------------
# Engine filters with pain_regex on the result side, so a noisy firehose is
# fine — the regex will only keep posts with WTP/pain language.
communities:
  - 'site:reddit.com/r/androidapps'
  - 'site:reddit.com/r/Android'
  - 'site:reddit.com/r/iOSApps'
  - 'site:reddit.com/r/iphone'
  - 'site:reddit.com/r/apple'
  - 'site:reddit.com/r/GooglePixel'
  - 'site:reddit.com/r/AppHookup'
  - 'site:reddit.com/r/SideProject "mobile app"'

# --- Cross-platform launch + gap signals (mobile bent) ----------------------
launch_signals:
  - 'site:news.ycombinator.com "Show HN" android'
  - 'site:news.ycombinator.com "Show HN" iOS'
  - 'site:news.ycombinator.com "Show HN" "mobile app"'
  - 'site:news.ycombinator.com "Ask HN" "is there an app"'
  - 'site:producthunt.com mobile app comments'
